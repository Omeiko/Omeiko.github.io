name: Update Google Scholar data

on:
  workflow_dispatch:
  schedule:
    # Weekly is frequent enough for a personal research profile and preserves API quota.
    # Changing this schedule also reactivates workflows disabled after repository inactivity.
    - cron: "37 3 * * 1"

permissions:
  contents: write

concurrency:
  group: update-google-scholar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch Google Scholar data
        env:
          SCHOLAR_PROFILE_ID: 1xge3_oAAAAJ
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: |
          if [ -z "${SERPAPI_API_KEY:-}" ]; then
            echo "Missing repository secret: SERPAPI_API_KEY"
            exit 1
          fi

          response_file="$(mktemp)"
          output_file="$(mktemp)"
          trap 'rm -f "$response_file" "$output_file"' EXIT

          curl --fail-with-body --silent --show-error --get \
            "https://serpapi.com/search.json" \
            --data-urlencode "engine=google_scholar_author" \
            --data-urlencode "hl=en" \
            --data-urlencode "author_id=${SCHOLAR_PROFILE_ID}" \
            --data-urlencode "api_key=${SERPAPI_API_KEY}" \
            --output "$response_file"

          jq --exit-status --arg profile_id "$SCHOLAR_PROFILE_ID" '
            if .error then
              error(.error)
            else
              {
                source: "Google Scholar",
                profile_id: $profile_id,
                profile_url: ("https://scholar.google.com/citations?user=" + $profile_id),
                updated_at: (now | todateiso8601),
                citations: ([.cited_by.table[] | select(.citations) | .citations.all][0] // 0),
                h_index: ([.cited_by.table[] | select(.h_index) | .h_index.all][0] // 0),
                i10_index: ([.cited_by.table[] | select(.i10_index) | .i10_index.all][0] // 0),
                articles: [
                  (.articles // [])[:20][] |
                  {
                    title,
                    link,
                    year,
                    citations: (.cited_by.value // 0)
                  }
                ]
              }
            end
          ' "$response_file" > "$output_file"

          jq --exit-status '
            (.source == "Google Scholar") and
            (.profile_id | length > 0) and
            (.citations | type == "number") and
            (.articles | type == "array")
          ' "$output_file" > /dev/null

          mkdir -p _data
          mv "$output_file" _data/scholar.json

          {
            echo "### Google Scholar refresh"
            echo
            echo "- Citations: $(jq -r '.citations' _data/scholar.json)"
            echo "- h-index: $(jq -r '.h_index' _data/scholar.json)"
            echo "- Papers returned: $(jq -r '.articles | length' _data/scholar.json)"
            echo "- Updated: $(jq -r '.updated_at' _data/scholar.json)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit updated data
        run: |
          git add _data/scholar.json

          if git diff --cached --quiet; then
            echo "Scholar data is unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update Google Scholar data"
          git push
