---
layout: default
---
<article class="page-shell">
  <header class="page-heading">
    {% if page.kicker %}<p class="section-label">{{ page.kicker }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p>{{ page.description }}</p>{% endif %}
  </header>
  <div class="page-content{% unless page.prose == false %} prose{% endunless %}">
    {{ content }}
  </div>
</article>
